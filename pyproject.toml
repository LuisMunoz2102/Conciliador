[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conciliador"
version = "0.1.0"
description = "Conciliación de cobros: facturas emitidas (CFDI) contra depósitos del estado de cuenta Santander"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "xlsxwriter>=3.2",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
conciliador = "conciliador.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
